apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-receptionist
  labels:
    app: sql-receptionist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sql-receptionist
  template:
    metadata:
      labels:
        app: sql-receptionist
    spec:
      containers:
        - name: master-database
          image: ghcr.io/wywysenarios/master-db/sql-receptionist:dev
          imagePullPolicy: IfNotPresent
          command: ["/home/sql-receptionist/app"]
          envFrom:
            - configMapRef:
                name: master-database-common
            - configMapRef:
                name: master-database-service-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-password
                  key: password
          ports:
            - name: http
              containerPort: 2523
          readinessProbe:
            tcpSocket:
              port: 2523
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 2523
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: wywy-config
              mountPath: /config.yml
              subPath: wywy.yml
              readOnly: true
      volumes:
        - name: wywy-config
          configMap:
            name: wywy-config
