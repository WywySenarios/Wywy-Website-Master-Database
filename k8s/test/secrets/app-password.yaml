# master_db_app's password for the KinD test flow.
# init.sh creates master_db_app with
# ${DATABASE_PASSWORD}, which the test postgres Deployment sources from the
# postgres-password secret — so app-password mirrors that value here. In
# prod/dev the app password is its own credential (app-password.sops).
apiVersion: v1
kind: Secret
metadata:
  name: app-password
type: Opaque
stringData:
  password: postgres-password-test
