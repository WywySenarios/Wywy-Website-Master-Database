apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: master-database-test

# The testing jobs are applied separately with `kubectl apply -f`. They are not applied with kustomize.
# They must start only after their prerequisites (postgres Ready, migrations done, API rolled out).
resources:
  - ../base
  - postgres.yaml
  - ./secrets

images:
  # Full registry path is required (kustomize anchors ^+name); newName strips
  # it because KinD has no registry.
  - name: docker-registry.github-runner:5000/master-db/sql-receptionist
    newName: master-db/sql-receptionist
    newTag: kind-test

patches:
  - target:
      kind: ConfigMap
      name: master-database-service-config
    patch: |-
      - op: replace
        path: /data/DATABASE_HOST
        value: "postgres"
  # Localhost values for the test overlay (base carries prod URLs).
  - target:
      kind: ConfigMap
      name: master-database-common
    patch: |-
      - op: replace
        path: /data/MAIN_URL
        value: "http://localhost:4321"
      - op: replace
        path: /data/CACHE_URL
        value: "http://localhost:8000"
      - op: replace
        path: /data/MAIN_DOMAIN
        value: "localhost"
      - op: replace
        path: /data/CACHE_DOMAIN
        value: "localhost"
  - target:
      kind: ConfigMap
      name: master-database-service-config
    patch: |-
      - op: replace
        path: /data/SYNC_STATUS
        value: "false"
  - target:
      kind: Deployment
      name: sql-receptionist
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command
        value: ["bash", "-c", "make clean && make && ulimit -n 1024 && exec valgrind --leak-check=yes --show-leak-kinds=definite --error-exitcode=1 ./app"]
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          tcpSocket:
            port: 2523
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 40
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          tcpSocket:
            port: 2523
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
