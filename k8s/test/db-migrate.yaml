apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: master-database-test
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-migrate
          image: master-db/db-migrate:kind-test
          args: ["migrate"] # entrypoint mode selection
          env:
            - name: DATABASE_HOST
              value: "postgres"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_MIGRATOR_USERNAME
              value: "wywy_migrator"
            - name: DATABASE_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: migrator-password
                  key: password
