apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: master-database

resources:
  - ../base

# Bootstrap pin: newTag must be a real :<sha> before first sync; Image
# Updater rewrites it at runtime (write-back: argocd).
images:
  - name: ghcr.io/wywysenarios/master-db/sql-receptionist
    newTag: dev
  - name: ghcr.io/wywysenarios/master-db/create_tables
    newTag: dev

patches:
  - target:
      kind: ConfigMap
      name: master-database-common
    patch: |-
      - op: replace
        path: /data/MAIN_URL
        value: "http://localhost:4321"
      - op: replace
        path: /data/CACHE_URL
        value: "http://localhost:8000"
      - op: replace
        path: /data/MAIN_DOMAIN
        value: "localhost"
      - op: replace
        path: /data/CACHE_DOMAIN
        value: "localhost"
