name: master-database

services:
  sql_receptionist:
    build:
      target: prod
      args:
        LIBCYAML_VARIANT: release
    networks:
      - cloudflared
      - postgres
    command: /home/sql-receptionist/app

  create_tables:
    networks:
      - postgres

  cloudflared:
    working_dir: /apps/cloudflared
    build:
      context: ../
      dockerfile: apps/cloudflared/Dockerfile
    environment:
      TZ: America/Toronto
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflared_token
    entrypoint: /entrypoint.sh
    restart: unless-stopped
    secrets:
      - cloudflared_token
    networks:
      - cloudflared

  postgres:
    secrets:
      - ssh_private_key
      - ssh_backup_public_key
    networks:
      - postgres

networks:
  cloudflared:
    name: cloudflared
  postgres:
    name: postgres
    driver: bridge

secrets:
  cloudflared_token:
    file: ${SECRETS_DIR}/master-database/cloudflared-cloudflare-token.txt
  ssh_private_key:
    file: ${SECRETS_DIR}/id_ed25519
  ssh_public_key:
    file: ${SECRETS_DIR}/id_ed25519.pub
  ssh_backup_public_key:
    file: ${SECRETS_DIR}/backup/ssh_host_ed25519_key.pub
